name: Compila APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (già presente sul runner)
        run: echo "sdk.dir=$ANDROID_HOME" && yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Firma fissa: Gradle firma le build di debug con ~/.android/debug.keystore
      # (password "android", alias "androiddebugkey"). Se il secret c'è, mettiamo lì
      # sempre lo stesso keystore, così ogni nuovo APK si installa sopra il precedente.
      - name: Keystore di debug fisso
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /dev/null
            echo "Uso il keystore fisso dal secret DEBUG_KEYSTORE_BASE64."
          else
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 assente: l'APK avrà una firma casuale e andrà disinstallata la versione precedente."
          fi

      - name: Installa dipendenze
        run: npm install

      - name: Crea progetto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx capacitor-assets generate --android --iconBackgroundColor '#23584A' --splashBackgroundColor '#23584A' || echo "Icone non generate, uso quelle predefinite"
          npx cap sync android

      - name: Compila
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rinomina APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AnnuncioPronto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AnnuncioPronto
          path: AnnuncioPronto.apk

      - name: Pubblica come release (link di download diretto)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Annuncio Pronto ${{ github.run_number }}
          files: AnnuncioPronto.apk
          make_latest: true
    permissions:
      contents: write
