name: Compila APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Installa dipendenze
        run: npm install

      - name: Crea progetto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx capacitor-assets generate --android --iconBackgroundColor '#23584A' --splashBackgroundColor '#23584A' || echo "Icone non generate, uso quelle predefinite"
          npx cap sync android

      - name: Compila
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rinomina APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AnnuncioPronto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AnnuncioPronto
          path: AnnuncioPronto.apk

      - name: Pubblica come release (link di download diretto)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Annuncio Pronto ${{ github.run_number }}
          files: AnnuncioPronto.apk
          make_latest: true
    permissions:
      contents: write
