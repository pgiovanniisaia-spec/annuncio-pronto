name: Compila APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (già presente sul runner)
        run: echo "sdk.dir=$ANDROID_HOME" && yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Firma fissa: Gradle firma le build di debug con ~/.android/debug.keystore
      # (password "android", alias "androiddebugkey"). Mettiamo lì sempre lo stesso keystore
      # (dal secret DEBUG_KEYSTORE_BASE64 se esiste, altrimenti signing/debug.keystore),
      # così ogni nuovo APK si installa sopra il precedente senza perdere i dati.
      - name: Keystore di debug fisso
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /dev/null
            echo "Uso il keystore fisso dal secret DEBUG_KEYSTORE_BASE64."
          else
            # nessun secret: keystore di debug fisso incluso nel progetto
            mkdir -p ~/.android
            cp signing/debug.keystore ~/.android/debug.keystore
            echo "Uso il keystore di debug del progetto (signing/debug.keystore)."
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -i "SHA256" || true

      - name: Installa dipendenze
        run: npm install

      - name: Crea progetto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx capacitor-assets generate --android --iconBackgroundColor '#E8F3EC' --splashBackgroundColor '#FFFFFF' --splashBackgroundColorDark '#FFFFFF' || echo "Icone non generate, uso quelle predefinite"
          npx cap sync android
          node scripts/android-setup.mjs

      - name: Compila
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rinomina APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ListLab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ListLab
          path: ListLab.apk

      - name: Pubblica come release (link di download diretto)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ListLab ${{ github.run_number }}
          files: ListLab.apk
          make_latest: true
    permissions:
      contents: write
